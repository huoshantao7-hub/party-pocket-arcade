<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开一局 · 街机口袋</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg" type="image/svg+xml"></head><body class="game-body"><header class="game-header"><a class="back-link" href="/"><span aria-hidden="true">←</span>街机口袋 <small class="mini-label">POCKET ARCADE</small></a><div class="game-header-right"><button class="tool-btn" id="sound" aria-pressed="false">声音：关</button><button class="tool-btn" id="fullscreen">全屏</button></div></header><main class="game-layout"><div class="game-main"><div class="game-title-row"><div><h1 id="game-title">正在准备游戏</h1><p id="game-subtitle">马上开一局</p></div><span class="game-number" id="game-number"></span></div><div class="scoreboard" aria-label="比赛记分板"><div class="score-cell"><small id="name0">P1</small><strong id="score0">0</strong><p id="detail0">等待开始</p></div><div class="game-timer"><strong id="timer">60</strong><small id="mode-label">单人陪练</small></div><div class="score-cell"><small id="name1">P2</small><strong id="score1">0</strong><p id="detail1">等待开始</p></div></div><div class="stage" id="stage"><canvas id="game-canvas" width="960" height="600" aria-label="游戏场地，可用键盘或下方触控按钮操作"></canvas><div class="stage-overlay" id="overlay"><div class="overlay-card"><p class="eyebrow">READY WHEN YOU ARE</p><h2 id="overlay-title">准备好了吗？</h2><p id="overlay-text">选好模式，随时开局。</p><button class="start-button" id="start">开始游戏</button></div></div></div><div class="game-control-bar"><label class="mode-control">玩法<select id="mode"><option value="solo">单人 + 机器人</option><option value="local">同屏双人</option><option value="demo">自动展示</option></select></label><div class="run-tools"><button class="tool-btn" id="pause" disabled>暂停</button><button class="tool-btn" id="reset">重新开局</button></div></div><p id="game-status" class="game-status" aria-live="polite"></p><div class="touch-zone" id="touch-zone"></div></div><aside class="game-sidebar"><section class="sidebar-box"><p class="eyebrow">HOW TO PLAY</p><h2>一眼就会玩</h2><ol id="rules" class="rules"></ol><div class="key-guide"><b>P1</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动<br><b>P2</b> <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 移动<br><span id="action-guide"></span><br><span id="alt-guide"></span></div></section><section class="sidebar-box"><p class="eyebrow">BRING A FRIEND</p><h2>手机变手柄</h2><p>电脑留在游戏画面，手机连同一 Wi-Fi，打开下方房间链接加入。</p><button class="room-btn" id="create-room">创建双人房间</button><div id="room-info" hidden><div class="room-code" id="room-code"></div><a class="room-link" id="room-link" target="_blank" rel="noopener"></a><button class="tool-btn" id="copy-room" style="margin-top:10px">复制链接</button><div id="room-players" style="margin-top:12px"></div><button class="tool-btn" id="close-room">关闭房间</button></div><p id="room-status" class="room-note">仅局域网控制，共享电脑画面；无需账号。</p></section></aside></main><script type="module" src="play.js"></script></body></html>
