<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111620"><title>手机手柄 · 街机口袋</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg" type="image/svg+xml"></head><body class="controller-body"><main class="controller-wrap"><a class="back-link" href="/"><span aria-hidden="true">←</span>街机口袋</a><p class="eyebrow" style="margin-top:32px;color:#c0df87">YOUR PHONE. YOUR CONTROLLER.</p><h1>这局，用手机玩。</h1><p>手机与电脑连接同一 Wi-Fi。电脑打开游戏房间，手机负责控制，游戏画面显示在电脑上。</p><form id="join-form" class="join-form"><label for="room-input">六位房间号</label><input id="room-input" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="例如 AB2C9D" required pattern="[A-Za-z0-9]{6}"><label for="slot">选择玩家</label><select id="slot"><option value="1">P2 · 第二位玩家</option><option value="0">P1 · 第一位玩家</option></select><button class="start-button" id="join" style="margin-top:10px">加入房间</button></form><p id="controller-status" class="controller-status" role="status">等待加入房间</p><section id="controller-controls" class="controller-controls" hidden></section><button id="leave" class="tool-btn" hidden>退出房间</button><p class="room-note" style="margin-top:25px">方向键移动 · A 主要动作 · B 辅助动作<br>动作名称以电脑上的游戏说明为准。切出页面后会自动松开按键。</p></main><script type="module" src="controller.js"></script></body></html>
