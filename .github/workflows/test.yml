name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run portable game and room tests
        run: node --test tests/*.test.mjs
      - name: Run both standalone game engines
        run: |
          node --test projects/cloud-courier/tests/*.test.mjs
          node --test projects/sunset-range/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run both local server boundary suites
        run: |
          cd projects/cloud-courier
          python -B -m unittest discover -s tests -p test_server.py -v
          cd ../sunset-range
          python -B -m unittest discover -s tests -p test_server.py -v
